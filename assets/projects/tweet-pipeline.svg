<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1c0e"/>
      <stop offset="1" stop-color="#160f07"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#f1ebe1" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#dots)"/>
  <rect width="640" height="360" fill="url(#glow)"/>

  <!-- incoming stream -->
  <g fill="#93C5FD">
    <circle cx="60" cy="130" r="4" fill-opacity="0.3"/><circle cx="78" cy="130" r="4" fill-opacity="0.5"/><circle cx="96" cy="130" r="4" fill-opacity="0.8"/>
  </g>

  <!-- stages -->
  <g font-size="13" text-anchor="middle">
    <rect x="114" y="104" width="104" height="52" rx="12" fill="#321f0f" stroke="#93C5FD" stroke-opacity="0.5"/>
    <text x="166" y="135" fill="#f1ebe1">kafka</text>
    <rect x="262" y="104" width="104" height="52" rx="12" fill="#321f0f" stroke="#F97316" stroke-opacity="0.6"/>
    <text x="314" y="135" fill="#f1ebe1">spark</text>
    <rect x="410" y="104" width="120" height="52" rx="12" fill="#321f0f" stroke="#FCD34D" stroke-opacity="0.5"/>
    <text x="470" y="135" fill="#f1ebe1">elastic</text>
  </g>
  <g stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round">
    <line x1="222" y1="130" x2="256" y2="130"/>
    <line x1="370" y1="130" x2="404" y2="130"/>
  </g>
  <path d="M470 160 V 186" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>

  <!-- dashboard -->
  <g transform="translate(114 192)">
    <rect width="416" height="112" rx="14" fill="#261a0e" stroke="#f1ebe1" stroke-opacity="0.1"/>
    <g>
      <rect x="22" y="62" width="18" height="34" rx="3" fill="#3B82F6" fill-opacity="0.6"/>
      <rect x="48" y="44" width="18" height="52" rx="3" fill="#3B82F6" fill-opacity="0.75"/>
      <rect x="74" y="28" width="18" height="68" rx="3" fill="#3B82F6"/>
      <rect x="100" y="52" width="18" height="44" rx="3" fill="#3B82F6" fill-opacity="0.7"/>
      <rect x="126" y="38" width="18" height="58" rx="3" fill="#3B82F6" fill-opacity="0.85"/>
    </g>
    <polyline points="180,84 214,62 246,72 278,40 310,52 342,26 384,36" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="342" cy="26" r="5" fill="#F59E0B"/>
    <line x1="180" y1="96" x2="390" y2="96" stroke="#f1ebe1" stroke-opacity="0.12"/>
    <rect x="22" y="14" width="70" height="6" rx="3" fill="#f1ebe1" fill-opacity="0.3"/>
  </g>

  <text x="32" y="330" font-size="13" fill="#a89f92" letter-spacing="1">stream → classify → dashboard</text>
</svg>
