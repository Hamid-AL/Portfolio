<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 -20 760 760" width="760" height="760" role="img" aria-label="Schéma d'un ingénieur data et IA : IA/ML, NLP et GenAI, analytics, bases de données, data engineering, cloud, outils et sources de données" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Transparent-background vector hero. Self-contained (works via <img>).
       Mid-tone colours read on both dark and light themes. -->
  <style>
    .c-purple{--c:#8B5CF6} .c-orange{--c:#F59E0B} .c-blue{--c:#3B82F6} .c-red{--c:#EF4444}
    .c-cyan{--c:#06B6D4} .c-green{--c:#10B981} .c-teal{--c:#14B8A6}
    .main{fill:none;stroke:var(--c);stroke-width:3}
    .halo{fill:none;stroke:var(--c);stroke-width:1;stroke-opacity:.4}
    .ico{fill:none;stroke:var(--c);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    .ico .f,.f{fill:var(--c);stroke:none}
    .wire{fill:none;stroke:var(--c);stroke-width:1.6;stroke-opacity:.75}
    .flow{fill:none;stroke:var(--c);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:2 16;animation:flow 3s linear infinite}
    .pill{fill:none;stroke:var(--c);stroke-width:1.4}
    .lbl{fill:var(--c);font:600 11px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.6px}
    .deco{fill:none;stroke:#8f8578;stroke-opacity:.55;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
    .deco .f{fill:#F59E0B;stroke:none}
    .dots{fill:#8f8578;fill-opacity:.55;stroke:#8f8578;stroke-opacity:.55}
    .core{fill:none;stroke:#F59E0B;stroke-width:3}
    .core-thin{fill:none;stroke:#F59E0B;stroke-width:1;stroke-opacity:.5}
    .orbit{fill:none;stroke:#8f8578;stroke-opacity:.4;stroke-width:1.2}
    .arcs{fill:none;stroke:#F59E0B;stroke-width:7;stroke-dasharray:70 150 38 295;transform-origin:400px 380px;animation:spin 24s linear infinite}
    .person{fill:none;stroke:#F59E0B;stroke-width:2.6;stroke-linecap:round}
    @keyframes flow{to{stroke-dashoffset:-36}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.flow{animation:none;stroke-dasharray:none;stroke-opacity:.3}.arcs{animation:none}}
  </style>

  
