<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-label="Graphe de compétences de Hamid Alalou : IA et LLM, Data Engineering, Cloud, DevOps, Machine Learning, Python" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Hero illustration: Hamid's skill graph, built from his CV.
       Self-contained (styles + animation inline) so it works through <img>.
       Mid-tone colours read on both dark and light themes. -->
  <style>
    .ring  { fill: none; stroke: #E8920A; stroke-opacity: 0.32; stroke-width: 1; stroke-dasharray: 2 6; }
    .edges line { stroke: #8f8578; stroke-opacity: 0.35; stroke-width: 1.2; }
    .cross line { stroke: #8f8578; stroke-opacity: 0.18; stroke-width: 1; stroke-dasharray: 3 5; }
    .flow line {
      stroke: #E8920A; stroke-opacity: 0.9; stroke-width: 1.6; stroke-linecap: round;
      stroke-dasharray: 3 14; animation: flow 2.8s linear infinite;
    }
    .flow line:nth-child(2n) { animation-duration: 3.6s; }
    .flow line:nth-child(3n) { animation-duration: 4.4s; animation-direction: reverse; }
    .sat   { fill: #8f8578; fill-opacity: 0.7; }
    .halo  { opacity: 0.18; }
    .core-ring { fill: none; stroke: #E8920A; stroke-width: 1.5; transform-origin: 240px 240px; animation: breathe 4s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .amber  { fill: #F59E0B; } .purple { fill: #8B5CF6; } .blue { fill: #3B82F6; }
    .red    { fill: #EF4444; } .green  { fill: #10B981; } .cyan { fill: #06B6D4; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .cat  { font-size: 12px; font-weight: 700; }
    .tool { font-size: 10.5px; fill: #8f8578; }
    .me   { font-size: 11px; font-weight: 700; fill: #E8920A; letter-spacing: 1px; }
    @keyframes flow    { to { stroke-dashoffset: -34; } }
    @keyframes breathe { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(2.4); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .flow line { animation: none; stroke-dasharray: none; stroke-opacity: 0.4; }
      .core-ring { display: none; }
    }
  </style>

  <circle class="ring" cx="240" cy="240" r="100"/>
  <circle class="ring" cx="240" cy="240" r="168"/>

  <g class="cross"><line x1="240" y1="140" x2="327" y2="190"/><line x1="327" y1="190" x2="327" y2="290"/><line x1="327" y1="290" x2="240" y2="340"/><line x1="240" y1="340" x2="153" y2="290"/><line x1="153" y1="290" x2="153" y2="190"/><line x1="153" y1="190" x2="240" y2="140"/></g>
  <g class="edges"><line x1="240" y1="240" x2="240" y2="140"/><line x1="240" y1="140" x2="199" y2="77"/><line x1="240" y1="140" x2="281" y2="77"/><line x1="240" y1="240" x2="327" y2="190"/><line x1="327" y1="190" x2="361" y2="123"/><line x1="327" y1="190" x2="401" y2="194"/><line x1="240" y1="240" x2="327" y2="290"/><line x1="327" y1="290" x2="401" y2="286"/><line x1="327" y1="290" x2="361" y2="357"/><line x1="240" y1="240" x2="240" y2="340"/><line x1="240" y1="340" x2="281" y2="403"/><line x1="240" y1="340" x2="199" y2="403"/><line x1="240" y1="240" x2="153" y2="290"/><line x1="153" y1="290" x2="119" y2="357"/><line x1="153" y1="290" x2="79" y2="286"/><line x1="240" y1="240" x2="153" y2="190"/><line x1="153" y1="190" x2="79" y2="194"/><line x1="153" y1="190" x2="119" y2="123"/></g>
  <g class="flow"><line x1="240" y1="140" x2="240" y2="240"/><line x1="240" y1="140" x2="199" y2="77"/><line x1="240" y1="240" x2="327" y2="190"/><line x1="327" y1="190" x2="361" y2="123"/><line x1="327" y1="290" x2="240" y2="240"/><line x1="327" y1="290" x2="401" y2="286"/><line x1="240" y1="240" x2="240" y2="340"/><line x1="240" y1="340" x2="281" y2="403"/><line x1="153" y1="290" x2="240" y2="240"/><line x1="153" y1="290" x2="119" y2="357"/><line x1="240" y1="240" x2="153" y2="190"/><line x1="153" y1="190" x2="79" y2="194"/></g>

  <circle class="sat" cx="199" cy="77" r="5"/><circle class="sat" cx="281" cy="77" r="5"/><circle class="sat" cx="361" cy="123" r="5"/><circle class="sat" cx="401" cy="194" r="5"/><circle class="sat" cx="401" cy="286" r="5"/><circle class="sat" cx="361" cy="357" r="5"/><circle class="sat" cx="281" cy="403" r="5"/><circle class="sat" cx="199" cy="403" r="5"/><circle class="sat" cx="119" cy="357" r="5"/><circle class="sat" cx="79" cy="286" r="5"/><circle class="sat" cx="79" cy="194" r="5"/><circle class="sat" cx="119" cy="123" r="5"/>
  <g class="purple"><circle class="halo" cx="240" cy="140" r="20"/><circle cx="240" cy="140" r="8"/></g><g class="blue"><circle class="halo" cx="327" cy="190" r="20"/><circle cx="327" cy="190" r="8"/></g><g class="cyan"><circle class="halo" cx="327" cy="290" r="20"/><circle cx="327" cy="290" r="8"/></g><g class="green"><circle class="halo" cx="240" cy="340" r="20"/><circle cx="240" cy="340" r="8"/></g><g class="red"><circle class="halo" cx="153" cy="290" r="20"/><circle cx="153" cy="290" r="8"/></g><g class="amber"><circle class="halo" cx="153" cy="190" r="20"/><circle cx="153" cy="190" r="8"/></g>

  <circle class="core-ring" cx="240" cy="240" r="16"/>
  <g class="amber"><circle class="halo" cx="240" cy="240" r="34"/><circle cx="240" cy="240" r="15"/></g>
  <text class="me" x="240" y="272" text-anchor="middle">HAMID</text>

  <text class="cat" fill="#8B5CF6" x="240" y="120" text-anchor="middle">IA &amp; LLM</text><text class="tool" x="199" y="65" text-anchor="middle">LightRAG</text><text class="tool" x="281" y="65" text-anchor="middle">MCP</text><text class="cat" fill="#3B82F6" x="341" y="182" text-anchor="start">Data</text><text class="tool" x="371" y="127">Airflow</text><text class="tool" x="411" y="198">dbt</text><text class="cat" fill="#06B6D4" x="341" y="306" text-anchor="start">Cloud</text><text class="tool" x="411" y="290">Azure</text><text class="tool" x="371" y="361">BigQuery</text><text class="cat" fill="#10B981" x="240" y="372" text-anchor="middle">DevOps</text><text class="tool" x="281" y="423" text-anchor="middle">Docker</text><text class="tool" x="199" y="423" text-anchor="middle">Terraform</text><text class="cat" fill="#EF4444" x="139" y="306" text-anchor="end">ML</text><text class="tool" x="109" y="361" text-anchor="end">PyTorch</text><text class="tool" x="69" y="290" text-anchor="end">BERTopic</text><text class="cat" fill="#F59E0B" x="139" y="182" text-anchor="end">Python</text><text class="tool" x="69" y="198" text-anchor="end">FastAPI</text><text class="tool" x="109" y="127" text-anchor="end">SQL</text>
</svg>
